<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Samsung Store Kiosk System</title>
  <meta name="description" content="CodeNote 직원 호출 시스템" />
  <link rel="stylesheet" href="/static/css/style.css?v=20260923manager1" />
  {% if manager_app | default(false) %}
  <link rel="stylesheet" href="/static/css/manager-web.css?v=20260923manager1" />
  {% endif %}
</head>
<body>
  <div id="app" class="app-shell"></div>

  <div id="callOverlay" class="call-overlay hidden" aria-live="assertive">
    <div id="callCard" class="call-card">
      <button id="closeOverlay" type="button" class="overlay-close" aria-label="호출 팝업 닫기">×</button>
      <div id="overlayService" class="overlay-service">간단서비스</div>
      <div id="overlayNumber" class="overlay-number">1</div>
      <div id="overlayMessage" class="overlay-message">간단서비스 창구로 와주세요</div>
    </div>
  </div>

  <script>
    window.SERVICE_META = {{ service_meta | tojson }};
    window.MANAGER_APP = {{ manager_app | default(false) | tojson }};
  </script>
  {% if manager_app | default(false) %}
  <script src="/static/js/manager-web.js?v=20260923scope2" defer></script>
  {% endif %}
  <script src="/static/js/queue-layout.js?v=20260923manager1" defer></script>
  <script src="/static/js/app.js?v=20260923scope2" defer></script>
</body>
</html>
